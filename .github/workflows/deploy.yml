name: Deploy naar GitHub Pages

# Bouwt de site bij elke push naar main en publiceert dist/ op GitHub Pages.
# Zet in de repo-instellingen: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechten die de deploy-actie nodig heeft.
permissions:
  contents: read
  pages: write
  id-token: write

# Slechts één deploy tegelijk; nieuwe pushes annuleren een lopende run niet halverwege.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Bouwen
        run: npm run build
        env:
          # Subpad van de projectsite (= repo-naam). Pas dit aan bij een andere repo
          # of zet '/' bij een eigen domein / *.github.io-root.
          VITE_BASE: /hairstudio-serenay-3/
          # Canoniek domein voor SEO/Open Graph op GitHub Pages.
          VITE_SITE_URL: https://erdem145.github.io/hairstudio-serenay-3

      - name: Pages-artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
